<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Flexbox Lesson</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
        <div class="flex-item">Item 4</div>
    </div>

    <div class="controls">
        <button id="justify-start">Justify Start</button>
        <button id="justify-center">Justify Center</button>
        <button id="justify-end">Justify End</button>
        <button id="justify-space-between">Space Between</button>
        <button id="justify-space-around">Space Around</button>
        <button id="align-start">Align Start</button>
        <button id="align-center">Align Center</button>
        <button id="align-end">Align End</button>
        <button id="align-stretch">Align Stretch</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
